<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIOS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>AIOS</h1>
          <p>Built for AI users and nerds · by Zack and Richard</p>
        </div>
      </header>

      <aside class="settings-card">
        <section class="provider-setup-card">
          <p class="provider-setup-title">Provider setup</p>
          <div id="providerSetupGroups" class="provider-setup-groups"></div>
        </section>

        <section class="control-group">
          <label for="providerSelect">Provider</label>
          <select id="providerSelect"></select>

          <label for="modelSelect">Model</label>
          <select id="modelSelect"></select>

          <div id="providerSettingsFields" class="custom-fields">
            <div id="providerBaseUrlRow" class="field-row">
              <label for="providerBaseUrl">Base URL</label>
              <input id="providerBaseUrl" type="url" placeholder="https://api.example.com/v1" />
            </div>

            <div id="providerApiKeyRow" class="field-row">
              <label for="providerApiKey">API key</label>
              <input id="providerApiKey" type="password" placeholder="sk-..." autocomplete="off" />
            </div>

            <div id="providerApiSecretRow" class="field-row hidden">
              <label for="providerApiSecret">API secret</label>
              <input id="providerApiSecret" type="password" placeholder="secret" autocomplete="off" />
            </div>

            <div class="auth-actions">
              <button id="saveProviderSettingsButton" type="button">Save provider settings</button>
              <button id="clearProviderSettingsButton" type="button" class="secondary">Clear stored settings</button>
            </div>
          </div>
        </section>

        <section id="authCard" class="auth-card">
          <p id="authSummary" class="auth-summary"></p>
          <p id="authDetail" class="auth-detail"></p>
          <div id="copilotAuth" class="hidden">
            <div class="auth-actions">
              <button id="copilotStartButton" type="button">Sign in with GitHub</button>
              <button id="copilotPollButton" type="button" class="secondary" disabled>Check sign-in</button>
            </div>
            <p id="copilotCode" class="auth-code hidden"></p>
            <a id="copilotLink" class="auth-link hidden" href="#" target="_blank" rel="noreferrer">Open GitHub device login</a>
          </div>
        </section>

        <section class="control-group">
          <label for="systemCommand">System action (Linux command)</label>
          <input id="systemCommand" type="text" placeholder="xfce4-terminal &" />
          <button id="runSystemCommand" type="button">Run command in workspace</button>
          <button id="listWorkspace" type="button">List workspace files</button>
          <button id="writeTestFile" type="button">Write test file in sandbox</button>
        </section>
      </aside>

      <main class="chat-card">
        <div id="messages" class="messages" aria-live="polite"></div>
        <form id="chatForm" class="composer">
          <input id="messageInput" type="text" placeholder="Message AIOS..." required />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>

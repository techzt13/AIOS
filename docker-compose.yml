services:
  desktop:
    build:
      context: .
      dockerfile: desktop/Dockerfile
    container_name: aios-desktop
    ports:
      - "${DESKTOP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - TITLE=AIOS Linux Desktop
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    volumes:
      - ./workspace:/workspace
      - ./desktop/AIOS.desktop:/config/Desktop/AIOS.desktop
    depends_on:
      - aios

  aios:
    build: .
    container_name: aios
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - WORKSPACE_ROOT=${WORKSPACE_ROOT:-/app/workspace}
      - SANDBOX_DIR=${WORKSPACE_ROOT:-/app/workspace}
      - ENABLE_EXEC_API=${ENABLE_EXEC_API:-false}
      - EXEC_TIMEOUT_MS=${EXEC_TIMEOUT_MS:-15000}
      - EXEC_MAX_OUTPUT_BYTES=${EXEC_MAX_OUTPUT_BYTES:-256000}
      - FS_READ_MAX_BYTES=${FS_READ_MAX_BYTES:-1048576}
    volumes:
      - ./workspace:/app/workspace
